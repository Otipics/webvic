<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page - MOT Studios</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    
    <link rel="stylesheet" href="assets/css/motsignup.css"">

</head>
<body>
    

    <div class="container">

        <!-- Left Panel -->
        <div class="lpanel">

            <h2>Welcome to MOT Studios</h2>

            <p>Create your account to manage your bookings, access your sessions, receive updates and enjoy exclusive offers from MOT Studios.</p>
            <br><br>

            <button id="btn1"><a href="signin.html" id="btn1">Already have an account? Signin</a></button>
            <br><br>




        </div>

        <!-- Right Panel -->
        <div id="rpanel">
            <form action="">

                <legend>Signup</legend>
                <br>
                

                <input type="text" placeholder="Enter your Username" name="username" id="username" required>
                <br><br>

                <input type="email" placeholder="Enter your email" id="email" name="email" required>
                <br><br>

                <input type="password" placeholder="Create your password" id="create-password" name="create-password" required>
                <br><br>

                <input type="password" placeholder="Confirm your password" id="confirm-password" name="confirm-password" required>
                <br><br>

                <button id="btn2">Create Account</button>
                <a href="index.html">Back</a>
                <br><br>

                <p>or signup with</p>

                <div id="socials">
                 <a href="https://search.brave.com/search?q=facebook"><img src="assets/icons/facebook.png" alt="facebook"></a>
                 <a href="https://search.brave.com/search?q=whatsapp"><img src="assets/icons/image.png" alt="Whatsapp"></a>
                 <a href="https://search.brave.com/search?q=linkedin"><img src="/assets/icons/linkedin.png" alt="linkedin"></a>

                </div>




            </form>

        </div>



    </div>


    
</body>
</html>
